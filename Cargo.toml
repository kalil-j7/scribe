[package]
name = "scribe"
version = "0.3.0"
edition = "2021"
description = "Scripture textual-study workbench: KJV Apocrypha + Septuagint, fast local CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kalil-j7/scribe"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
unicode-normalization = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
lto = "thin"
codegen-units = 1
